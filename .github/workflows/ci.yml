name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve package
        run: xcodebuild -resolvePackageDependencies -scheme HapticEase

      - name: Test on iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild test \
            -scheme HapticEase \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
